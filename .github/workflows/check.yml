name: Check

# Everything build.yml does up to the point where it would publish, on any branch that is not
# main. There is no way to build an APK in the Cowork sandbox — aapt2 ships x86_64-only for
# Linux — so a change worked on there has never been compiled by anything until it is pushed.
#
# Without this, BrightMarket had no branch CI at all: build.yml is main-only, so the only way
# to find out whether a change compiled was to push it to main, which cuts a build the phone
# offers as an update within minutes. The one app whose job is installing other apps is the
# worst one to prove on the device.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

# This workflow builds the head of a pull request, which is code nobody has
# reviewed yet, and it had no permissions block at all -- so every job here ran
# with whatever the repo default happened to be. Read-only, plus the packages
# read that light-common needs: settings.gradle.kts falls back to GITHUB_TOKEN
# when GPR_TOKEN is unset, and GitHub Packages has no anonymous read even for a
# public package.
permissions:
  contents: read
  packages: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Index parsing, version comparison and the Obtainium matcher are plain JVM code, and
      # each of them fails silently on a phone — a wrong answer here reads as "no update
      # available" forever rather than as a crash. Tests first so a logic break is the error
      # you see, not a resource one further down.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      # assembleRelease rather than a bare compile: manifest merge and resource processing are
      # where a missing class or a permission that does not exist actually surface, and a
      # Kotlin compile never reaches either.
      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      # No artifact upload here. This job's whole purpose is "does it compile",
      # and the APKs it produced were signed release builds of an unreviewed PR
      # head, downloadable by anyone who can see the run. build.yml publishes the
      # real one from main; a branch check has no business handing out an
      # installable that carries the release signature.
