name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'signing-fingerprint.txt'
  workflow_dispatch:

permissions:
  contents: write
  # light-common is a GitHub Packages artifact, and even a public package needs
  # an authenticated read.
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      # versionCode is the workflow run number, so every push produces a newer
      # build and `adb install -r` upgrades in place instead of erroring. The
      # index also derives versionCode from the tag's trailing segment, so these
      # two must stay in agreement.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # Index parsing, sort ordering and the Obtainium matcher are plain JVM code.
      # Each fails silently on a phone -- a wrong versionCode reads as "no update
      # available" forever -- so they gate the build.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}

      # The signing key is a secret, not a file in the repo. Written here and
      # nowhere else; the path is gitignored so a local checkout can't commit it
      # back by accident.
      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/brightmarket.jks
          # A missing or truncated secret would otherwise fall through to an
          # unsigned release that the fingerprint step rejects with a confusing
          # message. Fail here, where the cause is obvious.
          test -s keystore/brightmarket.jks || { echo '::error::KEYSTORE_B64 is empty'; exit 1; }

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # light-common resolves from GitHub Packages, which has no anonymous read.
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/BrightMarket-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/BrightMarket-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever
      # changes, updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ask the package what its
      # icon is rather than grepping filenames.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrightMarket-apk
          path: out/*.apk
          if-no-files-found: error

      # One asset per release: an updater picks whatever it finds, and a debug APK
      # alongside the release one is how it installs the wrong signature.
      # Curated notes beat an auto-generated commit list: the commit log says
      # what changed in the code, the notes say what changed for the person
      # installing it. Falls back to generated notes if the file is missing so a
      # release never blocks on prose.
      - name: Extract release notes
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            awk '/^## /{n++} n==1' RELEASE_NOTES.md | tail -n +2 > body.md
          fi
          [ -s body.md ] || echo "See the commit log for changes in this build." > body.md
          echo "--- release body ---"; cat body.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BrightMarket v${{ steps.ver.outputs.version }}
          files: out/BrightMarket-v${{ steps.ver.outputs.version }}.apk
          body_path: body.md
          make_latest: true

      # Tell the index to rebuild now rather than waiting for the hourly cron.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d '{"event_type":"app-released"}' \
          || echo "no INDEX_DISPATCH_TOKEN set; the hourly cron will pick this up"
